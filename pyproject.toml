[project]
name = "pedestrian-pipeline"
version = "0.1.0"
description = "Scheduled ingestion pipeline for Melbourne CBD pedestrian sensor data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jack Nguyen", email = "sagameko@gmail.com" }]
keywords = ["data-engineering", "etl", "duckdb", "polars", "open-data"]
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
ingest = "pedestrian_pipeline.ingestion.run:main"
report = "pedestrian_pipeline.analytics:main"

[project.optional-dependencies]
dashboard = [
    "altair>=6.2.2",
    "streamlit>=1.59.1",
]
screenshots = [
    "pillow>=12.3.0",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedestrian_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib over os.path
]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/pedestrian_pipeline --cov-report=term-missing"
